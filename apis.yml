description: 'Corner Health is a primary care provider network operating in Arizona and Washington that
  connects patients with independent nurse practitioners and advanced practice registered nurses (APRNs).
  The company offers everyday and preventative care, chronic condition management, women''s health,
  weight management and metabolic health, and hormone management, with longer appointment times,
  acceptance of major insurance plans, same-day/evening/Saturday availability, and continuity with the
  same provider across visits. It is a patient-facing healthcare service that publishes no public
  developer program, API, or technical documentation; this profile was surfaced as a portfolio company
  of homebrew and enriched with verified identity and domain-security signals.'
